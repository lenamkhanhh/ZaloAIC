[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaic-lifemate-harness"
version = "0.1.0"
description = "LifeMate agent, official-tool adapter, grounding and shadow diagnostics; bring your own models"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["lifemate"]
include-package-data = false

[tool.setuptools.package-data]
lifemate = ["configs/*.json", "splits/*.json"]
